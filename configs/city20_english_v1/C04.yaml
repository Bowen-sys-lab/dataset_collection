instruction: The target is initially behind you on your right. Find the round metal
  manhole cover set flush into the asphalt in the narrow street between the buildings,
  near low plants and parked vehicles. Look for concentric rings on the cover and
  a bright circular region in the thermal image that stands out from the surrounding
  road. Approach and stop where the cover and its thermal contrast are clearly visible.
