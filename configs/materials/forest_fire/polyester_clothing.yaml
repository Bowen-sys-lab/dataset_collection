# polyester_clothing：新版场景（2026-11-03）的人物目标用到这个材质，旧版 irsim 材质库里没有。
# 本项目按 wood_pine 的先例自行补一份：数值取自公开文献（不是从第三方仓库复制文件），
# 目的只是让旧版管线能解析同一组物理参数。
#
# 来源：
#   - LWIR/MWIR 发射率：Belliveau & Beauchamp 2020, Textile Research Journal 90(13-14):1431
#     （棉/尼龙/聚酯在 8–12 µm 约 0.88，与含水率无关）；Zhang, Hu & Zhang 2009, J. Textile Inst. 100:90
#     （织物发射率排序 PA > PET > wool > cotton；颜色不影响 LWIR 发射率）
#   - NIR/SWIR：ESTIMATED（中色调染料，参考 Kaur et al. 2024）
#   - 热物性：ESTIMATED（0.5 mm 针织、体密度 350 kg/m³、PET 比热 1200 J/kg/K）
schema_version: 2
material:
  name: polyester_clothing
  source: literature
  surface_treatment: as_manufactured
  reference: >-
    LWIR/MWIR: Belliveau & Beauchamp 2020 (Textile Research Journal 90:1431) and
    Zhang, Hu & Zhang 2009 (J. Textile Inst. 100:90). NIR/SWIR: ESTIMATED for a mid-tone dye.
    Thermal: ESTIMATED for a 0.5 mm knit at 350 kg/m3 bulk density.
  description: "Mid-tone polyester knit; a thin, light garment that tracks the air"
  thermal:
    density_kg_m3: 350
    specific_heat_j_kgk: 1200
    conductivity_w_mk: 0.05
    thickness_m: 0.0005
    solar_absorptivity: 0.70
  optical:
    emissivity_per_band: {nir: 0.45, swir: 0.55, mwir: 0.86, lwir: 0.88}
    roughness_per_band: {nir: 0.75, swir: 0.72, mwir: 0.65, lwir: 0.60}
    angular_model: {type: empirical, a: 0.08, p: 4.0}
