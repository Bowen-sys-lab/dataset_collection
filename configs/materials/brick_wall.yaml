# 黏土砖外墙（风化状态）。砖是多孔粗糙介质，红外里几乎是黑体——
# 这是为什么砖楼和混凝土楼在热图上长得差不多，区别主要来自温度和朝向，不是材质。
# LWIR 取文献典型范围 0.90-0.93 的中值；NIR/SWIR 为估计（红砖近红外反射偏高）。
schema_version: 2
material:
  name: brick_wall
  source: literature
  surface_treatment: weathered
  reference: "LWIR emissivity literature range 0.90-0.93 (midpoint); NIR/SWIR ESTIMATED"
  description: "外墙砖面。粗糙多孔，接近黑体；吸水后温度会明显下降，但发射率基本不变，温度请单独设定。"
  thermal:
    density_kg_m3: 1800
    specific_heat_j_kgk: 840
    conductivity_w_mk: 0.6
    thickness_m: 0.24
    solar_absorptivity: 0.65
  optical:
    emissivity_per_band: {nir: 0.72, swir: 0.80, mwir: 0.89, lwir: 0.91}
    roughness_per_band: {nir: 0.80, swir: 0.78, mwir: 0.72, lwir: 0.70}
    angular_model: {type: empirical, a: 0.05, p: 4.0}
