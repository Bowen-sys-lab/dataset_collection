# 森林火场景的温度/红外材质配置（本项目维护）。
# 结构与作者包里的 configs/thermal.yaml 相同，逐条搬过来以便：
#   1) 由本项目的 load_thermal_config 校验；
#   2) 与现有采集/回放流程共用同一套绑定语义（prim_path，不是显示名）。
# 单位：摄氏度。所有温度都是"指定值"，不是解算值。
schema_version: 1

defaults:
  target: soil
  material: soil_dry

targets:
  soil:
    mode: fixed
    temperature_c: 18.0
  leaves:
    mode: fixed
    temperature_c: 16.0
  wood:
    mode: fixed
    temperature_c: 17.0
  barrel:
    mode: fixed
    temperature_c: 110.0
  rim:
    mode: fixed
    temperature_c: 180.0
  embers:
    mode: fixed
    temperature_c: 500.0
  flame_proxy:
    mode: fixed
    temperature_c: 650.0
  # 作者在红外里把烟/火星隐藏（fire:rgbOnly）。本项目流程没有这一开关，
  # 因此给它们一个显式的低温目标，避免落进 defaults 后变成"贴地的 18 C 土壤"。
  smoke:
    mode: fixed
    temperature_c: 30.0

bindings:
  - name: binding_00_terrain
    prim_path: /World/Site/Forest/Terrain
    include_children: true
    target: soil
    material: soil_dry

  - name: binding_01_vegetation
    prim_path: /World/Site/Forest/Vegetation
    include_children: true
    target: leaves
    material: vegetation_leaf

  - name: binding_02_trunks
    prim_path: /World/Site/Forest/Trunks
    include_children: true
    target: wood
    material: wood_pine

  - name: binding_03_trail
    prim_path: /World/Site/Trail
    include_children: true
    target: soil
    material: soil_dry

  - name: binding_04_barrel_body
    prim_path: /World/Site/Target_BurningBarrel_001/Body
    include_children: true
    target: barrel
    material: rusted_steel

  - name: binding_05_barrel_rim
    prim_path: /World/Site/Target_BurningBarrel_001/HotRim
    include_children: true
    target: rim
    material: rusted_steel

  - name: binding_06_hotspot
    prim_path: /World/Site/Target_BurningBarrel_001/Hotspot
    include_children: true
    target: embers
    material: soil_dry

  - name: binding_07_flames
    prim_path: /World/Site/Target_BurningBarrel_001/Flames
    include_children: true
    target: flame_proxy
    material: soil_dry

  - name: binding_08_fire_atmosphere
    prim_path: /World/Site/Target_BurningBarrel_001/FireAtmosphere
    include_children: true
    target: smoke
    material: soil_dry
