task_id: model02_v4_tank_free_search
instruction: 从厂房附近起飞，沿外侧道路接近储罐区，找到带蓝色栏杆和红色外管的储罐。贴近罐壁缓慢环绕，用红外比较罐壁温度：某处温度明显高于周围其他表面即为异常。在距罐壁 6 至 8 米处悬停约 3 秒确认后安全撤离。
target_prim_path: /World/IndustrialPark02/InspectionZone01/Equipment/TANK_GC075/Shell_GC075/GC075_TankShell_Hotspot_Z_4337_m4937_16/GC075_TankShell_Hotspot_Z_4337_m4937_16_Mesh
target_description: GC075储罐罐壁局部异常
environment_description: 储罐区位于管廊和低层厂房外侧，周围为铺装场地。 傍晚弱光工况，13盏常规灯具分布于道路、入口、管廊及设备区外围。
  厂房与设备区接近位置新增设计铺装砖及填缝；其他地面为混凝土板与路缘。
environment_landmarks:
- 蓝色护栏储罐
- 较高设备组与架空管廊
- 沿线厂房
- 道路灯具
