instruction: The target is several blocks ahead, slightly to your left. Head eastward along the southern
  edge of the district, then search the streets near the target. Find the metal exhaust unit beside the
  curb in the service area along the southern building, near a street tree. Identify the horizontal louvers
  and the short duct on top. In the thermal image, look for a bright strip at the louver opening against
  the darker ground and wall. Approach and stop where the unit and the bright strip are clearly visible.
