# 2026-11-03 新版包的接入配置（与 forest_fire_scene.yaml 同构，只换 stage/热配置）
# 用途：先做最小验证；确认可用后再决定是否整体切换到新版。
schema_version: 1

task:
  file: forest_fire_task.yaml

scene:
  stage: ../forest_fire_scene_20261103_local/scene.usda
  thermal_scene: forest_fire_night_environment.yaml
  static_targets: []

drone:
  prim_path: /World/Crazyflie
  body_path: /World/Crazyflie/body
  camera_path: /World/Crazyflie/body/Camera_mount/Camera
  minimum_height: 1.5

sensors:
  width: 320
  height: 256
  # 注意：本项目的采集管线用旧版 irsim 的模型；pin 版 irsim 的 sensor 配置带
  # isp.detail_threshold_sigma / isp.agc_damping，旧版 pydantic 会拒绝（extra_forbidden）。
  # 所以这里必须指旧版；材质目录同理由管线自动补齐。
  sensor_config: ../third_party/isaac-thermal-camera-simulation/configs/sensors/flir_boson_640_lwir.yaml
  thermal_config: ../forest_fire_scene_20261103_local/configs/thermal.yaml
  preview_fast: true
  align_thermal_to_rgb: true
  flat_field_enabled: true
  sensor_seed: 741
  # 夜间窗口：包内默认是 10–150 °C，环境会几乎全黑
  display_config: forest_fire_display_night.yaml
  material_directory: materials/forest_fire
