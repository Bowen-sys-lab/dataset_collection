# Runtime collection recipe; launchability is determined by hashed readiness evidence.
schema_version: 1
status: runtime_recipe_requires_readiness_evidence
purpose: two-target lightweight BC pipeline smoke dataset
scene: factory/model02_thermal_v7m/model02_v7m_flight.usda
runtime_entry_support: checked_target_instruction_start_selection
requested_runtime_support: both_targets_and_validated_multiple_starts
counts_are_independent_flights: true
total_planned_demonstrations: 30

collection:
  pilot_per_target: 3
  pilot_included_in_training_if_accepted: true
  demonstrations_per_target: 15
  train_per_target: 9
  validation_per_target: 3
  test_per_target: 3
  train_start_groups: [A, B, D]
  validation_start_groups: [E]
  test_start_groups: [F]
  per_start_per_target: 3
  instruction_assignment: one_independent_flight_per_variant_at_each_start
  split_unit: start_group_and_whole_trajectory
  do_not_split_frames_or_rewordings_of_one_flight_across_splits: true
  pair_target_tasks_at_same_starts: true
  lighting: fixed_current_night_snapshot
  require_orbit: false
  require_return: false
  require_path_length: false
  approach: safe_natural_route_then_align_decelerate_observe_confirm_end

proposed_common_acceptance:
  observation_distance_range_m: [6.0, 8.0]
  distance_semantics: equipment_mesh_surface_minus_0.2m_body_envelope
  minimum_equipment_clearance_m: 5.0
  maximum_observation_speed_m_s: 0.3
  continuous_hold_simulation_s: 3.0
  maximum_sample_gap_s: 0.25
  hotspot_evidence: aligned_renderer_actual_target_surface_ID_pixels
  current_renderer_minimum_visible_pixels: 20
  visibility_limit: partial_visibility_only_not_full_surface_visibility_or_diagnostic_readability
  human_confirmation: keyboard_T_then_close_recording
  missing_evidence_result: UNJUDGED_unless_a_known_failure_already_exists
  whole_scene_collision: separate_check_not_certified_by_target_clearance
  pipe_criteria_status: proposed_requires_v7m_geometry_and_camera_check

targets:
  - target_id: tank_GC075
    description: 蓝色护栏、红色外接管的储罐罐壁异常发热区
    source_task: configs/model02_v7m_bc_pilot_task.yaml
    runtime_status: existing_single_start_pilot
    instruction_variants:
      - id: tank_01
        text: 请检查储罐罐壁上的局部异常发热区域，找到后停稳观察。
      - id: tank_02
        text: 请找到带蓝色护栏、连接红色外管的储罐，定位罐壁热点，并停在能清楚观察的位置。
      - id: tank_03
        text: 请在储罐区查找罐壁上局部温度明显异常的区域，确认所在储罐后悬停观察。
  - target_id: pipe_GC089
    description: 较高设备组靠道路侧立管的保温破损及裸露热管区域
    source_task: configs/model02_v3_pipe_task.yaml
    runtime_status: old_v3_task_exists_v7m_pilot_not_yet_connected
    instruction_variants:
      - id: pipe_01
        text: 请检查立管保温层破损的位置，找到裸露热管的异常发热区域后停稳观察。
      - id: pipe_02
        text: 请找到较高设备组靠道路侧的竖直管道，定位保温缺口处的热点，并停在能清楚观察的位置。
      - id: pipe_03
        text: 请在立管上查找保温破损、露管发热的区域，确认异常位置后悬停观察。

# Existing candidates reused as proposals, not as certified flight routes.
# Both targets use the same groups; do not give each target a unique birthplace.
start_groups:
  - group: A
    split: train
    position_m: [700.0, -845.0, 8.5]
    yaw_degrees: 90.0
    current_runtime_enabled_for: [tank_GC075]
    both_targets_validated: false
  - group: B
    split: train
    position_m: [720.0, -830.0, 10.0]
    yaw_degrees: 121.7043
    current_runtime_enabled_for: []
    both_targets_validated: false
  - group: D
    split: train
    position_m: [650.0, -820.0, 9.0]
    yaw_degrees: 37.101
    current_runtime_enabled_for: []
    both_targets_validated: false
  - group: E
    split: validation
    position_m: [740.0, -800.0, 11.0]
    yaw_degrees: 164.495
    current_runtime_enabled_for: []
    both_targets_validated: false
  - group: F
    split: test
    position_m: [660.0, -880.0, 10.0]
    yaw_degrees: 70.1706
    current_runtime_enabled_for: []
    both_targets_validated: false

readiness_gaps:
  - Verify the old GC089 target paths and measurement geometry in the composed v7m flight stage.
  - Connect target, instruction_variant and start_group selection to checked launch and recorded metadata.
  - Validate spawn clearance, reachable observation views and practical flight corridors before enabling candidates.
  - Validate camera visibility and pixel footprint for both targets at the proposed observation range.
  - Keep trajectory sampling and action timing valid when reducing live thermal preview work.
  - Generate dense causal observation-action pairs for BC; the default sparse replay video is insufficient.
  - Implement and verify model STOP semantics independently of the driver's T confirmation.
