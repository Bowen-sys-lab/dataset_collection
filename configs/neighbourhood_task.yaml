target_position_semantics: 世界坐标系（米），车辆网格包围盒中心
notes: 双模态判别任务：目标与干扰车在可见光下无差别，只有热像能区分（引擎盖余温）。判定方式：人工按 T 标记 + 自动核查（距目标 ≤5 m、目标在画面内、悬停 ≥3 s），评估器 scripts/evaluate_neighbourhood_task.py。
