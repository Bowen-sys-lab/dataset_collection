task_id: factory_tank_hotspot_refined_02
instruction: 请沿园区道路前往储罐区，检查边缘一排带蓝色护栏的圆柱储罐中最外侧的一座。先用可见光确认储罐外观及周围管廊、厂房，再用热红外查找罐壁上的异常热点。到达目标附近后，保持约
  6–8 米安全观察距离悬停 6 秒，确认故障位置后按 T 标记完成，随后返回外围安全区域。
target_prim_path: /World/IndustrialPark02/InspectionZone01/Equipment/TANK_GC075/Shell_GC075/GC075_TankShell_Hotspot/GC075_TankShell_Hotspot_Mesh
target_description: 蓝色护栏圆柱储罐的罐壁局部表面；模型未提供可读设备铭牌。
environment_description: 储罐区位于管廊和低层厂房外侧，周围为铺装场地。 夜间弱光工况，13盏常规灯具分布于道路、入口、管廊及设备区外围。
environment_landmarks:
- 成排圆柱储罐
- 蓝色护栏
- 架空管廊
- 低层厂房
