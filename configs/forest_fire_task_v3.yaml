# 森林火场景任务 · variant 3（目标特征）
# 2026-11-03 场景更新：路边有多个同类铁桶，只有一个是温度异常偏高的燃烧桶。
task_id: forest_fire_20261027_approach_v3
instruction: >-
  请寻找夜间森林路边那只温度异常偏高的铁桶——桶口有火焰、上方冒烟，红外上明显亮于其他桶；
  它位于当前起点以南约 50 米。注意不要把常温的铁桶当成目标。
  向它接近，在距其约 8 米处停住并悬停约 3 秒，用红外检查桶口是否明显热于周围地面。
target_prim_path: /World/Site/Target_BurningBarrel_001
target_description: 多个同类铁桶中温度异常偏高的那一只（桶口有明火）
target_position: [55.0, 6.86424822537128, 14.714128450870785]
target_position_semantics: 桶体锚点（不是火焰尖端）
start_position: [55.0, 55.0, 28.0]
environment_description: >-
  夜间针叶林，月光照明；一条土路东西贯穿，路边散布若干铁桶与杂物。
  场景约 250 × 250 米，四周是悬浮地形边界，飞出边界会看到天空。
environment_landmarks:
  - 东西向土路
  - 两侧针叶树与灌木
  - 路边的多只铁桶（其中一只在燃烧）
notes: >-
  与 variant 1／2 是同一任务的不同表述；目标、起点和完成要求一致。
  场景里有常温铁桶作为对照，判定依据是"温度异常偏高"，不是"看到桶"。
  温度与天气为人为设定，非实测；红外热点是 650 ℃ 表面代理，不代表燃烧气体辐射。
