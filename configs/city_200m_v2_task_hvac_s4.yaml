instruction: 目标在你的右后方。沿服务带靠墙一侧搜索，找一台白色空调外机：圆形风扇格栅、矮基座，约 1 米宽；这条服务带只有这一台，旁边是铁门和落水管。红外下盘管处有一小块 43 ℃ 热斑，其余部分不热。 先转向目标方向，靠近后确认热异常并按 T。
